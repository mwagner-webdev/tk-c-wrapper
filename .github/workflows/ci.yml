name: ci

on:
  push:
  pull_request:

# Each job builds the pinned Tcl/Tk 9.1.0 from source (cached per OS and
# architecture), builds libtkx, the test bridge and the examples, checks the
# committed generated files for drift and runs the tcltest suite.

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libx11-dev libxrender-dev xvfb zip
      - name: Restore Tcl/Tk builds
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: tcltk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.sh') }}
      - name: Build pinned Tcl/Tk 9.1.0
        run: make deps
      # Saved right away, so a later failing step does not discard the build.
      - name: Save Tcl/Tk builds
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps
          key: tcltk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.sh') }}
      - name: Build library, bridge, examples
        run: make
      - name: Generated files are up to date
        run: make check-generated
      - name: tcltest suite (Xvfb)
        run: make test
      - name: Compatibility with Tk 9.0.4
        run: make compat

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore Tcl/Tk builds
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: tcltk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.sh') }}
      - name: Build pinned Tcl/Tk 9.1.0 (Aqua)
        run: make deps
      # Saved right away, so a later failing step does not discard the build.
      - name: Save Tcl/Tk builds
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps
          key: tcltk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.sh') }}
      - name: Build library, bridge, examples
        run: make
      - name: Platform
        run: make info
      - name: Generated files are up to date
        run: make check-generated
      - name: tcltest suite (Aqua)
        run: make test

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: MSYS2 MINGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            tar
            curl
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
      - name: Restore Tcl/Tk builds
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: tcltk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.sh') }}
      - name: Build pinned Tcl/Tk 9.1.0 (win)
        run: make deps
      # Saved right away, so a later failing step does not discard the build.
      - name: Save Tcl/Tk builds
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps
          key: tcltk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/deps.sh') }}
      - name: Build library, bridge, examples
        run: make
      - name: Platform
        run: make info
      - name: Generated files are up to date
        run: make check-generated
      - name: tcltest suite (desktop session)
        run: make test
